<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>試合進行管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="{{ url_for('static', filename='js/sort_table.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_table.css') }}">
</head>

<body>

<h1>試合進行管理</h1>

<div id="dirtyBanner">⚠ 未保存の変更があります</div>

<!-- Undo UI -->
<div id="undoPanel">
  <button id="undoBtn" onclick="undo()">Undo</button>
  <span id="historyInfo">履歴: 1</span>
</div>

<div class="container">

{% for col in [0,1,2] %}
<div class="column">
<h3>{{ ["A","B","C"][col] }}</h3>

<div class="list" id="col{{col}}" data-col="{{col}}">

{% for item in data if item.col == col %}
<div class="cell
{% if item.status=='current' %}current{% endif %}
{% if item.status=='done' %}done{% endif %}
{% if item.status=='pending' %}pending{% endif %}
" data-id="{{item.id}}">

<div>
<span class="handle">⠿</span>
{{item.label}}<br>
<small>{{item.game}}</small><br>
<small>{{item.team_x}} vs {{item.team_y}}</small>
</div>

<div>
<label><input type="radio" name="s{{item.id}}" value="pending"
{% if item.status=='pending' %}checked{% endif %}>未</label>

<label><input type="radio" name="s{{item.id}}" value="current"
{% if item.status=='current' %}checked{% endif %}>今</label>

<label><input type="radio" name="s{{item.id}}" value="done"
{% if item.status=='done' %}checked{% endif %}>終</label>
</div>

</div>
{% endfor %}

</div>
</div>
{% endfor %}

</div>

<button id="saveBtn" onclick="save()">保存</button>

<script src="{{ url_for('static', filename='js/edit_table.js') }}"></script>

</body>
</html>
