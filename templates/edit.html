<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/edit</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: monospace;
    background: #f5f5f2;
    padding: 2rem;
    color: #1a1a1a;
    min-height: 100vh;
}

/* ── HEADER ── */
.header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 2rem;
    border-bottom: 1px solid #e0e0d8;
    padding-bottom: 1rem;
}

.header h1 {
    font-size: 18px;
    font-weight: 500;
}

.badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: #d1fae5;
    color: #065f46;
}

/* ── SECTION ── */
.section-label {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

/* ── CARDS ── */
.card-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.card {
    width: 260px;
    background: #fff;
    border: 1px solid #e8e8e2;
    border-radius: 8px;
    padding: 1.25rem 1.25rem 1rem;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    text-decoration: none;
    color: inherit;
    display: block;
}

.card:hover {
    border-color: #aaa;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.card-path {
    font-size: 15px;
    font-weight: 500;
    color: #1a1a1a;
    margin-bottom: 6px;
}

.card-desc {
    font-size: 11px;
    color: #888;
}

.card-arrow {
    font-size: 11px;
    color: #ccc;
    margin-top: 1.5rem;
}
</style>
</head>
<body>

<div class="header">
    <h1>/edit</h1>
    <span class="badge">dev only</span>
</div>

<div class="section-label">editors</div>

<div class="card-grid">

    <a class="card" href="/relay_editor">
        <div class="card-path">/relay_editor</div>
        <div class="card-desc">走順・リレーレース編集</div>
        <div class="card-arrow">→</div>
    </a>

    <a class="card" href="/tournaments_editor">
        <div class="card-path">/tournaments_editor</div>
        <div class="card-desc">トーナメント戦編集</div>
        <div class="card-arrow">→</div>
    </a>

</div>

</body>
</html>
