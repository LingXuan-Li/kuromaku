<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/message</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/message.css') }}">
</head>

<body>

<textarea id="editor" spellcheck="false" placeholder="ここにメッセージを入力"></textarea>
<div id="preview"></div>

<button id="saveBtn">保存</button>

<!-- 右クリックメニュー -->
<div id="menu" class="menu">
    <div onclick="execCmd('bold')">赤</div>
    <div onclick="execCmd('green')">緑</div>
    <div onclick="execCmd('blue')">青</div>
    <div onclick="execCmd('newsflash')">速報</div>
    <div onclick="execCmd('notice')">お知らせ</div>
    <div onclick="execCmd('letter')">おたより</div>
    <div onclick="execCmd('em-dash')">ダッシュ ────</div>
</div>

<script src="{{ url_for('static', filename='js/message.js') }}"></script>
</body>
</html>
