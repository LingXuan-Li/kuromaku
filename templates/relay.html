<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/relay_editor</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: monospace;
    background: #f5f5f2;
    padding: 2rem;
    color: #1a1a1a;
    line-height: 1.5;
}

/* ── HEADER ── */
.header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 2rem;
    border-bottom: 1px solid #e0e0d8;
    padding-bottom: 1rem;
    flex-wrap: wrap;
}

.header h1 {
    font-size: 18px;
    font-weight: 500;
}

.badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-block;
}
.badge-green  { background: #d1fae5; color: #065f46; }
.badge-blue   { background: #eff6ff; color: #1d4ed8; }
.badge-amber  { background: #fef3c7; color: #92400e; }

/* ── SECTION ── */
.section {
    margin-bottom: 2rem;
}

.section-label {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

/* ── CARD ── */
.card {
    background: #fff;
    border: 1px solid #e8e8e2;
    border-radius: 8px;
    overflow: hidden;
}

/* ── TABLE ── */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: #888;
    padding: 6px 10px;
    border-bottom: 1px solid #e8e8e2;
    background: #fafaf8;
}

td {
    padding: 7px 10px;
    border-bottom: 1px solid #f0f0ec;
    font-size: 13px;
}

tr:last-child td {
    border-bottom: none;
}

tr:hover td {
    background: #fafaf8;
}

/* ── RELAY TABLE INPUTS ── */
.relay-table td {
    padding: 5px 6px;
}

.relay-table input {
    width: 100%;
    border: 1px solid #e8e8e2;
    border-radius: 4px;
    padding: 4px 6px;
    font-family: monospace;
    font-size: 12px;
    background: #fff;
    color: #1a1a1a;
    transition: border-color .15s;
}

.relay-table input:focus {
    outline: none;
    border-color: #aaa;
}

/* ── BUTTONS ── */
.btn {
    border: 1px solid #e8e8e2;
    background: #fff;
    color: #1a1a1a;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
    font-size: 11px;
    transition: background .1s;
}
.btn:hover { background: #f0f0ec; }

.btn-dark {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
}
.btn-dark:hover { background: #333; border-color: #333; }

.btn-green {
    background: #d1fae5;
    color: #065f46;
    border-color: #6ee7b7;
}
.btn-green:hover { background: #a7f3d0; }

.btn-red {
    background: #fff;
    color: #991b1b;
    border-color: #fecaca;
}
.btn-red:hover { background: #fee2e2; }

/* ── CATEGORY PANEL ── */
.category-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #e8e8e2;
    border-radius: 8px;
}

.category-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-right: 4px;
}

#current-category {
    font-size: 12px;
    font-weight: 500;
    color: #1a1a1a;
    margin-right: 12px;
}

.category-divider {
    width: 1px;
    height: 16px;
    background: #e8e8e2;
    margin: 0 4px;
}

/* ── SAVE ROW ── */
.save-row {
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="header">
    <h1>/relay_editor</h1>
    <span class="badge badge-green">dev only</span>
</div>

<!-- カテゴリー切替 -->
<div class="category-panel">
    <span class="category-label">current</span>
    <span id="current-category">読み込み中...</span>
    <div class="category-divider"></div>
    <button class="btn btn-green" onclick="saveCategory('culture')">文化部予選</button>
    <button class="btn btn-green" onclick="saveCategory('sports')">運動部部予選</button>
    <button class="btn btn-green" onclick="saveCategory('relay')">本戦</button>
</div>

<div class="section">
    <div class="section-label">Notice</div>
    <p>テーブル上部: 1番レーン側</p>
    <p>テーブル下部: 6番レーン側</p>
</div>

<!-- 文化部 -->
<div class="section">
    <div class="section-label">Culture Club</div>
    <div class="card">
        <table class="relay-table">
            <thead>
                <tr>
                    <th>id</th>
                    <th>team</th>
                    <th>1st</th>
                    <th>2nd</th>
                    <th>3rd</th>
                    <th>4th</th>
                    <th>5th</th>
                    <th>6th</th>
                    <th>add</th>
                </tr>
            </thead>
            <tbody id="culture-body"></tbody>
        </table>
    </div>
    <div class="save-row">
    <button class="btn btn-dark" onclick="saveCulture()">
        Culture保存
    </button>
    </div>
</div>

<!-- 体育部 -->
<div class="section">
    <div class="section-label">Sports Club</div>
    <div class="card">
        <table class="relay-table">
            <thead>
                <tr>
                    <th>id</th>
                    <th>team</th>
                    <th>1st</th>
                    <th>2nd</th>
                    <th>3rd</th>
                    <th>4th</th>
                    <th>5th</th>
                    <th>6th</th>
                    <th>add</th>
                </tr>
            </thead>
            <tbody id="sports-body"></tbody>
        </table>
    </div>
    <div class="save-row">
    <button class="btn btn-dark" onclick="saveSports()">
        Sports保存
    </button>
    </div>
</div>

<!-- Final Relay -->
<div class="section">
    <div class="section-label">Final Relay</div>
    <div class="card">
        <table class="relay-table">
            <thead>
                <tr>
                    <th>team</th>
                    <th>1st</th>
                    <th>2nd</th>
                    <th>3rd</th>
                    <th>4th</th>
                    <th>5th</th>
                    <th>6th</th>
                    <th>delete</th>
                </tr>
            </thead>
            <tbody id="relay-body"></tbody>
        </table>
    </div>
    <div class="save-row">
        <button class="btn btn-dark" onclick="saveRelay()">Final Relay保存</button>
    </div>
</div>

<script>
let relayData = [];
let cultureData = [];
let sportsData = [];

async function loadCulture() {
    const res = await fetch("/api/culture_load");
    cultureData = await res.json();
    renderCulture();
}

async function loadSports() {
    const res = await fetch("/api/sports_load");
    sportsData = await res.json();
    renderSports();
}

async function loadRelay() {
    const res = await fetch("/api/relay_load");
    relayData = await res.json();
    renderRelay();
}

function renderCulture() {
    const tbody = document.getElementById("culture-body");
    tbody.innerHTML = "";

    cultureData.forEach((team, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${team.id}</td>
            <td><input value="${team.team_name || ''}"
                onchange="updateCulture(${index}, 'team_name', this.value)"></td>

            <td><input value="${team.first || ''}"
                onchange="updateCulture(${index}, 'first', this.value)"></td>

            <td><input value="${team.second || ''}"
                onchange="updateCulture(${index}, 'second', this.value)"></td>

            <td><input value="${team.third || ''}"
                onchange="updateCulture(${index}, 'third', this.value)"></td>

            <td><input value="${team.fourth || ''}"
                onchange="updateCulture(${index}, 'fourth', this.value)"></td>

            <td><input value="${team.fifth || ''}"
                onchange="updateCulture(${index}, 'fifth', this.value)"></td>

            <td><input value="${team.sixth || ''}"
                onchange="updateCulture(${index}, 'sixth', this.value)"></td>

            <td>
                <button class="btn btn-green"
                    onclick="addRelayFromCulture(${index})">
                    追加
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

function updateCulture(index, key, value) {
    cultureData[index][key] = value;
}

function addRelayFromCulture(index) {
    addRelay({...cultureData[index]});
}

function renderSports() {
    const tbody = document.getElementById("sports-body");
    tbody.innerHTML = "";

    sportsData.forEach((team, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${team.id}</td>
            <td><input value="${team.team_name || ''}"
                onchange="updateSports(${index}, 'team_name', this.value)"></td>

            <td><input value="${team.first || ''}"
                onchange="updateSports(${index}, 'first', this.value)"></td>

            <td><input value="${team.second || ''}"
                onchange="updateSports(${index}, 'second', this.value)"></td>

            <td><input value="${team.third || ''}"
                onchange="updateSports(${index}, 'third', this.value)"></td>

            <td><input value="${team.fourth || ''}"
                onchange="updateSports(${index}, 'fourth', this.value)"></td>

            <td><input value="${team.fifth || ''}"
                onchange="updateSports(${index}, 'fifth', this.value)"></td>

            <td><input value="${team.sixth || ''}"
                onchange="updateSports(${index}, 'sixth', this.value)"></td>

            <td>
                <button class="btn btn-green"
                    onclick="addRelayFromSports(${index})">
                    追加
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

function updateSports(index, key, value) {
    sportsData[index][key] = value;
}

function addRelayFromSports(index) {
    addRelay({...sportsData[index]});
}

function renderRelay() {
    const tbody = document.getElementById("relay-body");
    tbody.innerHTML = "";

    if (relayData.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="7" style="color:#aaa;text-align:center;padding:12px">（なし）</td>`;
        tbody.appendChild(tr);
        return;
    }

    relayData.forEach((team, index) => {
        const tr = document.createElement("tr");
        const fields = ['team_name','first','second','third','fourth','fifth','sixth'];
        const cells = fields.map(f => `
            <td>
                <input value="${team[f] ?? ''}"
                    onchange="updateField(${index}, '${f}', this.value)">
            </td>`).join('');

        tr.innerHTML = cells + `
            <td>
                <button class="btn btn-red" onclick="deleteRelay(${index})">削除</button>
            </td>`;
        tbody.appendChild(tr);
    });
}

function updateField(index, key, value) {
    relayData[index][key] = value;
}

function addRelay(team) {
    relayData.push(team);
    renderRelay();
}

function deleteRelay(index) {
    relayData.splice(index, 1);
    renderRelay();
}

async function saveCulture() {
    await fetch("/api/culture_save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: cultureData })
    });

    alert("CultureClubを保存しました");
}

async function saveSports() {
    await fetch("/api/sports_save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: sportsData })
    });
    alert("SportsClubを保存しました");
}

async function saveRelay() {
    await fetch("/api/relay_save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: "relay", items: relayData })
    });
    alert("Final Relayを保存しました");
}

async function saveCategory(category) {
    await fetch("/api/category_save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category })
    });
    await loadCategory();
    alert(`案内表示を ${category} に切り替えました`);
}

async function loadCategory() {
    const res = await fetch("/api/category_load");
    const data = await res.json();
    document.getElementById("current-category").innerText =
        data.category_name + "（" + data.category + "）";
}

loadCulture();
loadSports();
loadRelay();
loadCategory();
</script>
</body>
</html>
