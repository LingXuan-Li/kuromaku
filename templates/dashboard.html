<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <title>Sports Fes. Dashboard</title>
</head>
<body>

<div id="field-a">
  <div class="field">
    <span class="field-name-large">A</span>
  </div>

  <div class="match-info">
    <div class="team-row">
      <div class="team">
        <span id="a-teamX" class="team-name-x">---</span>
      </div>

      <div class="vs">VS</div>

      <div class="team">
        <span id="a-teamY" class="team-name-y">---</span>
      </div>
    </div>
  </div>

  <div class="next-info">
    <div class="next-game-info">
      <span class="next">次</span>
      <span id="a-next" class="next-team">---</span>
    </div>

    <div class="gathering-info">
      <span class="gathering">その次</span>
      <span id="a-gathering" class="gathering-team">---</span>
    </div>
  </div>
</div>

<div id="field-b">
  <div class="field">
    <span class="field-name-large">B</span>
  </div>

  <div class="match-info">
    <div class="team-row">
      <div class="team">
        <span id="b-teamX" class="team-name-x">---</span>
      </div>

      <div class="vs">VS</div>

      <div class="team">
        <span id="b-teamY" class="team-name-y">---</span>
      </div>
    </div>
  </div>

  <div class="next-info">
    <div class="next-game-info">
      <span class="next">NEXT</span>
      <span id="b-next" class="next-team">---</span>
    </div>

    <div class="gathering-info">
      <span class="gathering">集 合</span>
      <span id="b-gathering" class="gathering-team">---</span>
    </div>
  </div>
</div>

<div id="field-c">
  <div class="field">
    <span class="field-name-large">C</span>
  </div>

  <div class="match-info">
    <div class="team-row">
      <div class="team">
        <span id="c-teamX" class="team-name-x">---</span>
      </div>

      <div class="vs">VS</div>

      <div class="team">
        <span id="c-teamY" class="team-name-y">---</span>
      </div>
    </div>
  </div>

  <div class="next-info">
    <div class="next-game-info">
      <span class="next">NEXT</span>
      <span id="c-next" class="next-team">---</span>
    </div>

    <div class="gathering-info">
      <span class="gathering">集 合</span>
      <span id="c-gathering" class="gathering-team">---</span>
    </div>
  </div>
</div>

<!-- information bar -->

<div class="info-bar">

  <div class="info-scroll">
    <div class="info-text scroll-once">
      <span id="info-message">情報を取得しています...</span>
    </div>
  </div>

  <div class="info-theme">
    <img src="{{ url_for('static', filename='img/spark_logotipe.svg') }}" alt="SPARK">
  </div>

</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
