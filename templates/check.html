<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>/check</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: monospace;
            background: #f5f5f2;
            padding: 2rem;
            color: #1a1a1a;
        }

        .header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e0e0d8;
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 18px;
            font-weight: 500;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #d1fae5;
            color: #065f46;
        }

        .section {
            margin-bottom: 1.5rem;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card {
            background: #fff;
            border: 1px solid #e8e8e2;
            border-radius: 8px;
            padding: 1rem;
        }

        .msg-item {
            font-size: 13px;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0ec;
            display: flex;
            gap: 8px;
        }

        .msg-item:last-child {
            border-bottom: none;
        }

        .msg-index {
            font-size: 11px;
            color: #aaa;
            min-width: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            color: #888;
            padding: 6px 10px;
            border-bottom: 1px solid #e8e8e2;
            background: #fafaf8;
        }

        td {
            padding: 7px 10px;
            border-bottom: 1px solid #f0f0ec;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fafaf8;
        }

        .pill {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #eff6ff;
            color: #1d4ed8;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>/check</h1>
        <span class="badge">dev only</span>
    </div>

    <div class="section">
        <div class="section-label">messages</div>
        <div class="card">
            {% for msg in messages %}
                <div class="msg-item">
                    <span class="msg-index">{{ loop.index0 }}</span>
                    <span>{{ msg }}</span>
                </div>
            {% else %}
                <div class="msg-item">
                    <span style="color:#aaa">（なし）</span>
                </div>
            {% endfor %}
        </div>
    </div>

    <div class="section">
        <div class="section-label">tournaments</div>
        <div class="card" style="padding:0;overflow:hidden">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>team</th>
                        <th>game</th>
                        <th>tournament</th>
                        <th>seed</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in tournaments %}
                        <tr>
                            <td>{{ t.id }}</td>
                            <td>{{ t.team_name }}</td>
                            <td><span class="pill">{{ t.game }}</span></td>
                            <td>{{ t.tournament_number }}</td>
                            <td>{{ t.seed }}</td>
                        </tr>
                    {% else %}
                        <tr>
                            <td colspan="5" style="color:#aaa;text-align:center">（なし）</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
