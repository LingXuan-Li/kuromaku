<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/class_relay</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: monospace;
    background: #f5f5f2;
    padding: 2rem;
    color: #1a1a1a;
    line-height: 1.5;
}

/* ── HEADER ── */
.header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 2rem;
    border-bottom: 1px solid #e0e0d8;
    padding-bottom: 1rem;
    flex-wrap: wrap;
}

.header h1 {
    font-size: 18px;
    font-weight: 500;
}

.badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-block;
}
.badge-green  { background: #d1fae5; color: #065f46; }
.badge-blue   { background: #eff6ff; color: #1d4ed8; }
.badge-amber  { background: #fef3c7; color: #92400e; }

/* ── SECTION ── */
.section {
    margin-bottom: 2rem;
}

.section-label {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
}

/* ── CARD ── */
.card {
    background: #fff;
    border: 1px solid #e8e8e2;
    border-radius: 8px;
    overflow: hidden;
}

/* ── TABLE ── */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: #888;
    padding: 6px 10px;
    border-bottom: 1px solid #e8e8e2;
    background: #fafaf8;
}

td {
    padding: 7px 10px;
    border-bottom: 1px solid #f0f0ec;
    font-size: 13px;
}

tr:last-child td {
    border-bottom: none;
}

tr:hover td {
    background: #fafaf8;
}

/* ── RELAY TABLE INPUTS ── */
.relay-table td {
    padding: 5px 6px;
}

.relay-table input {
    width: 100%;
    border: 1px solid #e8e8e2;
    border-radius: 4px;
    padding: 4px 6px;
    font-family: monospace;
    font-size: 12px;
    background: #fff;
    color: #1a1a1a;
    transition: border-color .15s;
}

.relay-table input:focus {
    outline: none;
    border-color: #aaa;
}

.drag-handle {
    cursor: grab;
    text-align: center;
    color: #888;
    -webkit-user-select: none;
    user-select: none;
    font-size: 16px;
    width: 40px;
}

.drag-th {
    width:40px;
}

.drag-handle:active {
    cursor: grabbing;
}

/* ── BUTTONS ── */
.btn {
    border: 1px solid #e8e8e2;
    background: #fff;
    color: #1a1a1a;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
    font-size: 11px;
    transition: background .1s;
}
.btn:hover { background: #f0f0ec; }

.btn-dark {
    background: #1a1a1a;
    color: #fff;
    border-color: #1a1a1a;
}
.btn-dark:hover { background: #333; border-color: #333; }

.btn-green {
    background: #d1fae5;
    color: #065f46;
    border-color: #6ee7b7;
}
.btn-green:hover { background: #a7f3d0; }

.btn-red {
    background: #fff;
    color: #991b1b;
    border-color: #fecaca;
}
.btn-red:hover { background: #fee2e2; }

/* ── CATEGORY PANEL ── */
.category-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #e8e8e2;
    border-radius: 8px;
}

.category-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-right: 4px;
}

#current-category {
    font-size: 12px;
    font-weight: 500;
    color: #1a1a1a;
    margin-right: 12px;
}

.category-divider {
    width: 1px;
    height: 16px;
    background: #e8e8e2;
    margin: 0 4px;
}

/* ── SAVE ROW ── */
.save-row {
    margin-top: 10px;
}
</style>
</head>
<body>

<div class="header">
    <h1>/class_relay</h1>
    <span class="badge badge-green">dev only</span>
</div>

<div class="section">
    <div class="section-label">Notice</div>
    <p>テーブル上部: 1番レーン側</p>
    <p>テーブル下部: 3番レーン側</p>
</div>

<div class="section">
    <div class="section-label">Class Relay Race</div>
    <div class="card">
        <table class="relay-table">
            <thead>
                <tr>
                    <th class="drag-th"></th>
                    <th>team</th>
                    <th>1st</th>
                    <th>2nd</th>
                    <th>3rd</th>
                    <th>4th</th>
                    <th>5th</th>
                    <th>6th</th>
                    <th>7th</th>
                    <th>8th</th>
                    <th>9th</th>
                    <th>10th</th>
                </tr>
            </thead>
            <tbody id="race-body"></tbody>
        </table>
    </div>
    <div class="save-row">
    <button class="btn btn-dark" onclick="saveRace()">
        保存
    </button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/sort_table.js') }}"></script>
<script>
let sortable;
let classRelayData = [];

async function loadRelay() {
    const res = await fetch("/api/class_relay_load");
    classRelayData = await res.json();
    renderRelay();
}

function renderRelay() {
    const tbody = document.getElementById("race-body");
    tbody.innerHTML = "";

    classRelayData.forEach((team, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td class="drag-handle">⠿</td>
            <td><input value="${team.team_name || ''}" onchange="updateRelay(${index}, 'team_name', this.value)"></td>
            <td><input value="${team.first || ''}" onchange="updateRelay(${index}, 'first', this.value)"></td>
            <td><input value="${team.second || ''}" onchange="updateRelay(${index}, 'second', this.value)"></td>
            <td><input value="${team.third || ''}" onchange="updateRelay(${index}, 'third', this.value)"></td>
            <td><input value="${team.fourth || ''}" onchange="updateRelay(${index}, 'fourth', this.value)"></td>
            <td><input value="${team.fifth || ''}" onchange="updateRelay(${index}, 'fifth', this.value)"></td>
            <td><input value="${team.sixth || ''}" onchange="updateRelay(${index}, 'sixth', this.value)"></td>
            <td><input value="${team.seventh || ''}" onchange="updateRelay(${index}, 'seventh', this.value)"></td>
            <td><input value="${team.eighth || ''}" onchange="updateRelay(${index}, 'eighth', this.value)"></td>
            <td><input value="${team.ninth || ''}" onchange="updateRelay(${index}, 'ninth', this.value)"></td>
            <td><input value="${team.tenth || ''}" onchange="updateRelay(${index}, 'tenth', this.value)"></td>
        `;

        tbody.appendChild(tr);
    });

    initSortable();
}

function updateRelay(index, key, value) {
    classRelayData[index][key] = value;
}

async function saveRace() {
    await fetch("/api/class_relay_save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: classRelayData })
    });

    alert("保存しました");
}

function initSortable() {

    if (sortable) {
        sortable.destroy();
    }

    sortable = new Sortable(
        document.getElementById("race-body"),
        {
            animation: 150,
            handle: ".drag-handle",

            onEnd(evt) {

                const moved =
                    classRelayData.splice(evt.oldIndex, 1)[0];

                classRelayData.splice(
                    evt.newIndex,
                    0,
                    moved
                );
            }
        }
    );
}

loadRelay();
</script>
</body>
</html>
